<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Surf Intensity Meter</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 40px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #f8fafc;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .gauge-wrapper {
            position: relative;
            width: 100%;
            padding-top: 50%; /* Holds 2:1 aspect ratio for half circle */
            margin-bottom: 20px;
        }
        svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }
        .needle {
            transform-origin: 100px 90px;
            will-change: transform;
        }
        .controls {
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            max-width: 400px;
            background: #334155;
            height: 14px;
            border-radius: 7px;
            outline: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #f8fafc;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }
        input[type=range]::-moz-range-thumb {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #f8fafc;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Surf Intensity Meter</h1>
        
        <div class="gauge-wrapper">
            <svg viewBox="0 0 200 100">
                <defs>
                    <!-- Linear gradient with 5 transition steps -->
                    <linearGradient id="intensityGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#ef4444" />    <!-- Red -->
                        <stop offset="25%" stop-color="#f97316" />   <!-- Orange -->
                        <stop offset="50%" stop-color="#eab308" />   <!-- Yellow -->
                        <stop offset="75%" stop-color="#84cc16" />   <!-- Light Green -->
                        <stop offset="100%" stop-color="#22c55e" />  <!-- Dark Green -->
                    </linearGradient>
                </defs>

                <!-- Full arc track filled with the custom gradient -->
                <path d="M 20 90 A 80 80 0 0 1 180 90 L 165 90 A 65 65 0 0 0 35 90 Z" fill="url(#intensityGradient)"/>
                
                <!-- 4 Threshold Divider Lines separating the 5 zones evenly -->
                <!-- Line 1: Red / Orange Border -->
                <line x1="47.41" y1="51.79" x2="35.28" y2="42.98" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" />
                <!-- Line 2: Orange / Yellow Border -->
                <line x1="79.91" y1="28.18" x2="75.28" y2="13.92" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" />
                <!-- Line 3: Yellow / Light Green Border -->
                <line x1="120.09" y1="28.18" x2="124.72" y2="13.92" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" />
                <!-- Line 4: Light Green / Dark Green Border -->
                <line x1="152.59" y1="51.79" x2="164.72" y2="42.98" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" />
                
                <!-- Center Pin -->
                <circle cx="100" cy="90" r="6" fill="#f8fafc"/>
                
                <!-- Needle Pointer -->
                <g id="needle" class="needle">
                    <polygon points="98,90 100,15 102,90" fill="#f8fafc" />
                </g>
            </svg>
        </div>

        <div class="controls">
            <!-- Slider range mapped from left (-85deg) to right (85deg) -->
            <input type="range" id="intensitySlider" min="-85" max="85" value="-85">
        </div>
    </div>

    <script>
        const slider = document.getElementById('intensitySlider');
        const needle = document.getElementById('needle');

        function updateMeter() {
            needle.style.transform = `rotate(${slider.value}deg)`;
        }

        slider.addEventListener('input', updateMeter);
        slider.addEventListener('change', updateMeter);
        
        // Initialize position on load
        updateMeter();
    </script>

</body>
</html>
